<!doctype html>
<html lang="zh-CN">
<head>
  <meta charset="utf-8" />
  <title>米家小组件</title>
  <link rel="stylesheet" href="style.css" />
</head>
<body>
  <div class="widget">
    <header class="titlebar">
      <div class="brand">
        <span class="logo">
          <img src="../assets/logo-white.svg" alt="米家" />
        </span>
        <div class="brand-text">
          <h1>米家</h1>
          <p id="subtitle">正在连接…</p>
        </div>
      </div>
      <div class="actions">
        <button id="btn-menu" class="icon-btn" title="菜单" aria-haspopup="true" aria-expanded="false">
          <svg viewBox="0 0 24 24" width="16" height="16" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round">
            <path d="M4 7h16M4 12h16M4 17h16" />
          </svg>
        </button>
      </div>
    </header>

    <main id="devices" class="devices"></main>

    <footer class="statusbar">
      <span class="dot ok"></span>
      <span id="updated">已连接</span>
      <span class="spacer"></span>
      <span class="mock-tag">演示数据</span>
    </footer>

    <!-- 菜单遮罩：菜单展开时覆盖整窗（含标题栏拖拽区），点击任意位置即可收起 -->
    <div id="menu-backdrop" class="menu-backdrop" hidden></div>

    <!-- 设备右键操作菜单（内容由 app.js 动态填充） -->
    <div id="ctx-menu" class="ctx-menu" role="menu" hidden></div>

    <div id="menu" class="menu" role="menu" hidden>
      <button class="menu-item" id="mi-top" role="menuitemcheckbox" aria-checked="false">
        <span class="mi-icon">
          <svg viewBox="0 0 24 24" width="15" height="15" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round">
            <path d="M12 17v5" />
            <path d="M9 10.76a2 2 0 0 1-1.11 1.79l-1.78.9A2 2 0 0 0 5 15.24V16a1 1 0 0 0 1 1h12a1 1 0 0 0 1-1v-.76a2 2 0 0 0-1.11-1.79l-1.78-.9A2 2 0 0 1 15 10.76V6h1a2 2 0 0 0 0-4H8a2 2 0 0 0 0 4h1Z" />
          </svg>
        </span>
        <span class="mi-label">窗口置顶</span>
        <span class="mi-check">
          <svg viewBox="0 0 24 24" width="14" height="14" fill="none" stroke="currentColor" stroke-width="2.6" stroke-linecap="round" stroke-linejoin="round">
            <path d="M5 12.5l4.5 4.5L19 7.5" />
          </svg>
        </span>
      </button>
      <button class="menu-item" id="mi-pin" role="menuitem">
        <span class="mi-icon">
          <svg viewBox="0 0 24 24" width="15" height="15" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round">
            <rect x="3" y="4" width="18" height="16" rx="2.5" />
            <path d="M3 16.5h18" />
          </svg>
        </span>
        <span class="mi-label">固定到任务栏</span>
        <span class="mi-check"></span>
      </button>
      <button class="menu-item" id="mi-login" role="menuitemcheckbox" aria-checked="false">
        <span class="mi-icon">
          <svg viewBox="0 0 24 24" width="15" height="15" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round">
            <path d="M4.5 16.5c-1.5 1.26-2 5-2 5s3.74-.5 5-2c.71-.84.7-2.13-.09-2.91a2.18 2.18 0 0 0-2.91-.09z" />
            <path d="m12 15-3-3a22 22 0 0 1 2-3.95A12.88 12.88 0 0 1 22 2c0 2.72-.78 7.5-6 11a22.35 22.35 0 0 1-4 2z" />
            <path d="M9 12H4s.55-3.03 2-4c1.62-1.08 5 0 5 0" />
            <path d="M12 15v5s3.03-.55 4-2c1.08-1.62 0-5 0-5" />
          </svg>
        </span>
        <span class="mi-label">开机自动启动</span>
        <span class="mi-check">
          <svg viewBox="0 0 24 24" width="14" height="14" fill="none" stroke="currentColor" stroke-width="2.6" stroke-linecap="round" stroke-linejoin="round">
            <path d="M5 12.5l4.5 4.5L19 7.5" />
          </svg>
        </span>
      </button>
      <button class="menu-item" id="mi-cloud" role="menuitem">
        <span class="mi-icon">
          <svg viewBox="0 0 24 24" width="15" height="15" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round">
            <path d="M7 18a4.5 4.5 0 0 1-.5-8.97A6 6 0 0 1 18 9.5a3.75 3.75 0 0 1 .5 7.48" />
            <path d="M12 12v7" />
            <path d="M9.5 16.5 12 19l2.5-2.5" />
          </svg>
        </span>
        <span class="mi-label">登录米家 / 设备</span>
        <span class="mi-check"></span>
      </button>
      <button class="menu-item" id="mi-home" role="menuitem">
        <span class="mi-icon">
          <svg viewBox="0 0 24 24" width="15" height="15" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round">
            <path d="M3 10.5 12 3l9 7.5" />
            <path d="M5 9.5V20a1 1 0 0 0 1 1h12a1 1 0 0 0 1-1V9.5" />
            <path d="M9.5 21v-5.5h5V21" />
          </svg>
        </span>
        <span class="mi-label">选择家庭</span>
        <span class="mi-check"></span>
      </button>
      <button class="menu-item" id="mi-hidden" role="menuitem">
        <span class="mi-icon">
          <svg viewBox="0 0 24 24" width="15" height="15" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round">
            <path d="M2.5 12S6 5.5 12 5.5 21.5 12 21.5 12 18 18.5 12 18.5 2.5 12 2.5 12Z" />
            <path d="M4 4l16 16" />
          </svg>
        </span>
        <span class="mi-label">隐藏的设备</span>
        <span class="mi-check"></span>
      </button>
      <div class="menu-sep"></div>
      <button class="menu-item" id="mi-reset" role="menuitem">
        <span class="mi-icon">
          <svg viewBox="0 0 24 24" width="15" height="15" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round">
            <rect x="2.5" y="4" width="19" height="12.5" rx="2" />
            <path d="M9 20.5h6M12 16.5v4" />
            <path d="M8.5 10.25h7M12.5 7.5l2.75 2.75L12.5 13" />
          </svg>
        </span>
        <span class="mi-label">发送到副屏</span>
        <span class="mi-check"></span>
      </button>
      <button class="menu-item" id="mi-fs" role="menuitemcheckbox" aria-checked="false">
        <span class="mi-icon">
          <svg viewBox="0 0 24 24" width="15" height="15" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round">
            <path d="M4 9V4h5" />
            <path d="M15 4h5v5" />
            <path d="M20 15v5h-5" />
            <path d="M9 20H4v-5" />
          </svg>
        </span>
        <span class="mi-label">全屏</span>
        <span class="mi-check">
          <svg viewBox="0 0 24 24" width="14" height="14" fill="none" stroke="currentColor" stroke-width="2.6" stroke-linecap="round" stroke-linejoin="round">
            <path d="M5 12.5l4.5 4.5L19 7.5" />
          </svg>
        </span>
      </button>
      <button class="menu-item" id="mi-fs-cover" role="menuitemcheckbox" aria-checked="false">
        <span class="mi-icon">
          <svg viewBox="0 0 24 24" width="15" height="15" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round">
            <path d="M4 8V4h4" />
            <path d="M16 4h4v4" />
            <path d="M20 16v4h-4" />
            <path d="M8 20H4v-4" />
            <path d="M4 16.5h16" />
          </svg>
        </span>
        <span class="mi-label">全屏（隐藏任务栏）</span>
        <span class="mi-check">
          <svg viewBox="0 0 24 24" width="14" height="14" fill="none" stroke="currentColor" stroke-width="2.6" stroke-linecap="round" stroke-linejoin="round">
            <path d="M5 12.5l4.5 4.5L19 7.5" />
          </svg>
        </span>
      </button>
      <button class="menu-item" id="mi-hide" role="menuitem">
        <span class="mi-icon">
          <svg viewBox="0 0 24 24" width="15" height="15" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round">
            <path d="M12 3v9" />
            <path d="M8 8.5l4 4 4-4" />
            <path d="M4 19h16" />
          </svg>
        </span>
        <span class="mi-label">收起到托盘</span>
        <span class="mi-check"></span>
      </button>
      <div class="menu-sep"></div>
      <button class="menu-item danger" id="mi-quit" role="menuitem">
        <span class="mi-icon">
          <svg viewBox="0 0 24 24" width="15" height="15" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round">
            <path d="M6 6l12 12M18 6L6 18" />
          </svg>
        </span>
        <span class="mi-label">退出</span>
        <span class="mi-check"></span>
      </button>
    </div>

    <div id="pin-modal" class="pin-modal" hidden>
      <div class="pin-card" role="dialog" aria-modal="true" aria-labelledby="pin-title">
        <div class="pin-head">
          <h2 id="pin-title">固定到任务栏</h2>
          <button id="pin-close" class="icon-btn" title="关闭" aria-label="关闭">
            <svg viewBox="0 0 24 24" width="13" height="13" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round">
              <path d="M6 6l12 12M18 6L6 18" />
            </svg>
          </button>
        </div>
        <p class="pin-tip">已临时把本程序放到任务栏，请手动固定：</p>
        <ol class="pin-steps">
          <li>在任务栏上右键本程序图标 → 选择「固定到任务栏」</li>
          <li>完成后在这个对话框点「确定」</li>
        </ol>
        <p class="pin-note">点「确定」后会恢复工具窗口模式，不再占用任务栏。</p>
        <div class="pin-actions">
          <button id="pin-ok" class="pin-btn">确定</button>
        </div>
      </div>
    </div>

    <div id="login-modal" class="pin-modal" hidden>
      <div class="pin-card login-card" role="dialog" aria-modal="true" aria-labelledby="login-title">
        <div class="pin-head">
          <h2 id="login-title">登录米家</h2>
          <button id="login-close" class="icon-btn" title="关闭" aria-label="关闭">
            <svg viewBox="0 0 24 24" width="13" height="13" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round">
              <path d="M6 6l12 12M18 6L6 18" />
            </svg>
          </button>
        </div>

        <p class="login-state" id="login-state">正在读取登录状态…</p>

        <div class="login-tabs" role="tablist">
          <button class="login-tab active" id="tab-pwd" data-tab="pwd" role="tab">密码登录</button>
          <button class="login-tab" id="tab-qr" data-tab="qr" role="tab">二维码登录</button>
        </div>

        <div class="login-pane" id="pane-pwd">
          <label class="login-field">
            <span>小米账号</span>
            <input id="login-user" type="text" autocomplete="username" placeholder="手机号 / 邮箱 / 小米 ID" />
          </label>
          <label class="login-field">
            <span>密码</span>
            <input id="login-pass" type="password" autocomplete="current-password" placeholder="密码" />
          </label>
          <label class="login-field">
            <span>服务器</span>
            <select id="login-country">
              <option value="cn">中国大陆</option>
              <option value="de">欧洲</option>
              <option value="us">美国</option>
              <option value="sg">新加坡</option>
              <option value="ru">俄罗斯</option>
              <option value="tw">台湾</option>
            </select>
          </label>
          <button id="login-pwd-btn" class="pin-btn">登录</button>
        </div>

        <div class="login-pane" id="pane-qr" hidden>
          <div class="qr-box">
            <div class="qr-placeholder" id="qr-placeholder">点击下方「生成二维码」<br />再用米家 App 扫一扫</div>
            <img id="qr-img" class="qr-img" alt="登录二维码" hidden />
          </div>
          <p class="login-tip">在米家 App 里扫一扫上方二维码，或点按钮重新生成。</p>
          <button id="login-qr-btn" class="pin-btn">生成二维码</button>
        </div>

        <p class="login-msg" id="login-msg" hidden></p>

        <div class="login-foot">
          <button id="login-refresh" class="pin-btn ghost">刷新设备</button>
          <button id="login-logout" class="pin-btn danger">退出登录</button>
        </div>
      </div>
    </div>

    <div id="home-modal" class="pin-modal" hidden>
      <div class="pin-card" role="dialog" aria-modal="true" aria-labelledby="home-title">
        <div class="pin-head">
          <h2 id="home-title">选择家庭</h2>
          <button id="home-close" class="icon-btn" title="关闭" aria-label="关闭">
            <svg viewBox="0 0 24 24" width="13" height="13" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round">
              <path d="M6 6l12 12M18 6L6 18" />
            </svg>
          </button>
        </div>
        <p class="login-state" id="home-state">正在读取家庭列表…</p>
        <div class="home-list" id="home-list"></div>
      </div>
    </div>

    <div id="fan-dir-modal" class="pin-modal" hidden>
      <div class="pin-card dir-card" role="dialog" aria-modal="true" aria-labelledby="fan-dir-title">
        <div class="pin-head">
          <h2 id="fan-dir-title">手动风向</h2>
          <button id="fan-dir-close" class="icon-btn" title="关闭" aria-label="关闭">
            <svg viewBox="0 0 24 24" width="13" height="13" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round">
              <path d="M6 6l12 12M18 6L6 18" />
            </svg>
          </button>
        </div>
        <p class="dir-tip" id="fan-dir-tip">点击方向键微调风扇朝向</p>
        <div class="dir-pad">
          <button class="dir-btn" data-dir="turnUpward" title="向上" aria-label="向上">
            <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.2" stroke-linecap="round" stroke-linejoin="round"><path d="M6 15l6-6 6 6" /></svg>
          </button>
          <button class="dir-btn" data-dir="turnLeft" title="向左" aria-label="向左">
            <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.2" stroke-linecap="round" stroke-linejoin="round"><path d="M15 6l-6 6 6 6" /></svg>
          </button>
          <div class="dir-center">风向</div>
          <button class="dir-btn" data-dir="turnRight" title="向右" aria-label="向右">
            <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.2" stroke-linecap="round" stroke-linejoin="round"><path d="M9 6l6 6-6 6" /></svg>
          </button>
          <button class="dir-btn" data-dir="turnDownward" title="向下" aria-label="向下">
            <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.2" stroke-linecap="round" stroke-linejoin="round"><path d="M6 9l6 6 6-6" /></svg>
          </button>
        </div>
      </div>
    </div>

    <div id="hidden-modal" class="pin-modal" hidden>
      <div class="pin-card" role="dialog" aria-modal="true" aria-labelledby="hidden-title">
        <div class="pin-head">
          <h2 id="hidden-title">隐藏的设备</h2>
          <button id="hidden-close" class="icon-btn" title="关闭" aria-label="关闭">
            <svg viewBox="0 0 24 24" width="13" height="13" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round">
              <path d="M6 6l12 12M18 6L6 18" />
            </svg>
          </button>
        </div>
        <p class="login-state" id="hidden-state">正在读取…</p>
        <div class="home-list" id="hidden-list"></div>
      </div>
    </div>
  </div>

  <script src="app.js"></script>
</body>
</html>
