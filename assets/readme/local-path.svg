  <text x="64" y="252" font-size="20" fill="#C6C1BA">扫码得到的凭据只落在本机 userData 目录，卡片上的状态来自米家官方接口与设备本身。</text>
  <text x="64" y="284" font-size="20" fill="#8A857F">不接入第三方统计或广告服务，不上传设备列表，也不内置任何账号、密码或设备 Token。</text>
