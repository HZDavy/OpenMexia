<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 420" width="1200" height="420" role="img" aria-labelledby="hdrTitle hdrDesc">
  <title id="hdrTitle">OpenMexia — 开源、本地优先的智能家居控制中枢</title>
  <desc id="hdrDesc">左侧为 OpenMexia 星芒标记与字标，一句话说明：把不同协议的设备收进一个客户端；下方标注当前支持米家 MIoT、Matter 规划中。右侧为应用内真实设备卡片：吸顶灯（卧室，已关闭，亮度 100%、色温 6100K）、空调（客厅，制冷中，目标温度 24.0℃、模式制冷）、温湿度计（客厅，在线，温度 25.6℃、湿度 49%）、台灯（书房，已开启，亮度 53%、色温 4450K）。底部标注 Windows 10/11 x64、v0.1.1、AGPL-3.0。</desc>

  <g font-family="'Segoe UI Variable Text', 'Segoe UI', 'Microsoft YaHei UI', 'PingFang SC', -apple-system, system-ui, sans-serif">
    <rect width="1200" height="420" rx="28" fill="#141416"/>
    <rect x="0.5" y="0.5" width="1199" height="419" rx="27.5" fill="none" stroke="#26262B"/>

    <!-- 品牌区 -->
    <g transform="translate(64 52)">
      <rect width="56" height="56" rx="14" fill="#22C688"/>
      <g transform="scale(0.875)" stroke="#FFFFFF" stroke-width="5.6" stroke-linecap="round">
        <line x1="14" y1="32" x2="50" y2="32"/>
        <line x1="32" y1="14" x2="32" y2="50"/>
        <line x1="19.3" y1="19.3" x2="44.7" y2="44.7"/>
        <line x1="44.7" y1="19.3" x2="19.3" y2="44.7"/>
      </g>
    </g>
    <text x="136" y="101" font-size="58" font-weight="700" letter-spacing="-1.6" fill="#F5F3EF">OpenMexia</text>

    <!-- 一句话价值 -->
    <text x="64" y="190" font-size="25" fill="#C9C5BF">把不同协议的设备，收进一个客户端</text>
    <text x="64" y="228" font-size="25" fill="#8B8781">本地登录，数据只留在本机</text>

    <!-- 生态状态 -->
    <rect x="64" y="258" width="176" height="34" rx="17" fill="#1C1C20" stroke="#2C2C32"/>
    <circle cx="84" cy="275" r="4" fill="#22C688"/>
    <text x="96" y="280.5" font-size="15" fill="#DCD8D2">米家 MIoT · 已支持</text>

    <rect x="252" y="258" width="152" height="34" rx="17" fill="#1C1C20" stroke="#2C2C32"/>
    <circle cx="272" cy="275" r="4" fill="#57534F"/>
    <text x="284" y="280.5" font-size="15" fill="#918C86">Matter · 规划中</text>

    <!-- 仓库信息 -->
    <line x1="64" y1="316" x2="496" y2="316" stroke="#232327"/>
    <text x="64" y="350" font-family="'Cascadia Mono', 'Consolas', 'SFMono-Regular', 'Menlo', monospace" font-size="16" letter-spacing="0.4" fill="#7A7671">Windows 10/11 x64 · v0.1.1 · AGPL-3.0</text>

    <!-- 设备卡片：数据取自应用截图 -->
    <!-- 吸顶灯 -->
    <g transform="translate(560 52)">
      <rect width="280" height="150" rx="16" fill="#1E1E22" stroke="#2C2C32"/>
      <rect x="16" y="16" width="36" height="36" rx="10" fill="#26262B"/>
      <g transform="translate(16 16)" fill="none" stroke="#E8B04B" stroke-width="2" stroke-linecap="round" stroke-linejoin="round">
        <path d="M10 18a8 8 0 0 1 16 0Z"/>
        <path d="M18 10V7.5"/>
        <path d="M12 22v3"/>
        <path d="M18 22v4"/>
        <path d="M24 22v3"/>
      </g>
      <text x="62" y="40" font-size="20" font-weight="600" fill="#F1EEEA">吸顶灯</text>
      <text x="62" y="60" font-size="14" fill="#807C76">卧室</text>
      <circle cx="204" cy="34" r="3.6" fill="#6B6660"/>
      <text x="264" y="39" font-size="15" fill="#8E8983" text-anchor="end">已关闭</text>
      <line x1="16" y1="78" x2="264" y2="78" stroke="#2A2A2F"/>
      <text x="16" y="103" font-size="16" fill="#8A857F">亮度</text>
      <text x="148" y="103" font-size="16" fill="#8A857F">色温</text>
      <text x="16" y="138" font-size="27" font-weight="700" fill="#F4F1ED">100<tspan font-size="15" font-weight="500" fill="#A29D96">%</tspan></text>
      <text x="148" y="138" font-size="27" font-weight="700" fill="#F4F1ED">6100<tspan font-size="15" font-weight="500" fill="#A29D96">K</tspan></text>
    </g>

    <!-- 空调 -->
    <g transform="translate(856 52)">
      <rect width="280" height="150" rx="16" fill="#1E1E22" stroke="#2C2C32"/>
      <rect x="16" y="16" width="36" height="36" rx="10" fill="#26262B"/>
      <g transform="translate(16 16)" fill="none" stroke="#7AA7FF" stroke-width="2" stroke-linecap="round">
        <rect x="8" y="11" width="20" height="10" rx="3"/>
        <path d="M12 25v4"/>
        <path d="M18 25v4"/>
        <path d="M24 25v4"/>
      </g>
      <text x="62" y="40" font-size="20" font-weight="600" fill="#F1EEEA">空调</text>
      <text x="62" y="60" font-size="14" fill="#807C76">客厅</text>
      <circle cx="204" cy="34" r="3.6" fill="#8FB4FF"/>
      <text x="264" y="39" font-size="15" fill="#8FB4FF" text-anchor="end">制冷中</text>
      <line x1="16" y1="78" x2="264" y2="78" stroke="#2A2A2F"/>
      <text x="16" y="103" font-size="16" fill="#8A857F">目标温度</text>
      <text x="148" y="103" font-size="16" fill="#8A857F">模式</text>
      <text x="16" y="138" font-size="27" font-weight="700" fill="#F4F1ED">24.0<tspan font-size="15" font-weight="500" fill="#A29D96">℃</tspan></text>
      <text x="148" y="137" font-size="21" font-weight="600" fill="#9FC0FF">制冷</text>
    </g>

    <!-- 温湿度计 -->
    <g transform="translate(560 218)">
      <rect width="280" height="150" rx="16" fill="#1E1E22" stroke="#2C2C32"/>
      <rect x="16" y="16" width="36" height="36" rx="10" fill="#26262B"/>
      <g transform="translate(16 16)" fill="none" stroke="#5FD3C4" stroke-width="2" stroke-linecap="round" stroke-linejoin="round">
        <path d="M18 8c0 0-7.5 8-7.5 12.7a7.5 7.5 0 0 0 15 0C25.5 16 18 8 18 8Z"/>
        <path d="M18 16.5v5"/>
      </g>
      <text x="62" y="40" font-size="20" font-weight="600" fill="#F1EEEA">温湿度计</text>
      <text x="62" y="60" font-size="14" fill="#807C76">客厅</text>
      <circle cx="222" cy="34" r="3.6" fill="#5FD3C4"/>
      <text x="264" y="39" font-size="15" fill="#5FD3C4" text-anchor="end">在线</text>
      <line x1="16" y1="78" x2="264" y2="78" stroke="#2A2A2F"/>
      <text x="16" y="103" font-size="16" fill="#8A857F">温度</text>
      <text x="148" y="103" font-size="16" fill="#8A857F">湿度</text>
      <text x="16" y="138" font-size="27" font-weight="700" fill="#F4F1ED">25.6<tspan font-size="15" font-weight="500" fill="#A29D96">℃</tspan></text>
      <text x="148" y="138" font-size="27" font-weight="700" fill="#F4F1ED">49<tspan font-size="15" font-weight="500" fill="#A29D96">%</tspan></text>
    </g>

    <!-- 台灯 -->
    <g transform="translate(856 218)">
      <rect width="280" height="150" rx="16" fill="#1E1E22" stroke="#2C2C32"/>
      <rect x="16" y="16" width="36" height="36" rx="10" fill="#26262B"/>
      <g transform="translate(16 16)" fill="none" stroke="#F2A65A" stroke-width="2" stroke-linecap="round" stroke-linejoin="round">
        <path d="M13 18 18 9l5 9Z"/>
        <path d="M18 18v7"/>
        <path d="M12 26h12"/>
      </g>
      <text x="62" y="40" font-size="20" font-weight="600" fill="#F1EEEA">台灯</text>
      <text x="62" y="60" font-size="14" fill="#807C76">书房</text>
      <circle cx="204" cy="34" r="3.6" fill="#35D98A"/>
      <text x="264" y="39" font-size="15" fill="#35D98A" text-anchor="end">已开启</text>
      <line x1="16" y1="78" x2="264" y2="78" stroke="#2A2A2F"/>
      <text x="16" y="103" font-size="16" fill="#8A857F">亮度</text>
      <text x="148" y="103" font-size="16" fill="#8A857F">色温</text>
      <text x="16" y="138" font-size="27" font-weight="700" fill="#F4F1ED">53<tspan font-size="15" font-weight="500" fill="#A29D96">%</tspan></text>
      <text x="148" y="138" font-size="27" font-weight="700" fill="#F4F1ED">4450<tspan font-size="15" font-weight="500" fill="#A29D96">K</tspan></text>
    </g>
  </g>
</svg>
